  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.6;padding-bottom:124px;-webkit-font-smoothing:antialiased}
#app{max-width:920px;margin:0 auto;padding:0 14px}
input,select,button,textarea{font:inherit;color:inherit}
input,select,table{font-variant-numeric:tabular-nums}
::placeholder{color:#a8bcc7}

header{padding:16px 0 12px;margin-bottom:6px;display:flex;align-items:center;gap:12px;
  border-bottom:2px solid var(--ink)}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.04em}
header .st{font-size:11px;color:var(--sub);margin-left:auto}

button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;
  cursor:pointer;font-size:14px}
button:active{background:var(--head)}
.pri{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.danger{color:var(--hot);border-color:#dbb3ae}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* 一覧 */
.pl{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);
  padding:13px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.no{flex:0 0 34px;text-align:center;font-size:19px;font-weight:700;color:var(--accent)}
.pl .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pl .nm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .mt{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .rt{flex:0 0 auto;text-align:right;font-size:11.5px;color:var(--dim);white-space:nowrap;
  display:flex;flex-direction:column;gap:1px}
.pl .yr2{color:var(--sub);font-size:10.5px}
.retired .nm{color:var(--dim)}
.empty{padding:36px 4px;color:var(--sub);font-size:14px;line-height:1.9;text-align:center}

/* タブ */
nav.tabs{display:flex;gap:6px;margin:14px 0 18px;background:var(--head);
  border-radius:8px;padding:4px;overflow:auto}
nav.tabs button{flex:1;border:0;border-radius:6px;padding:9px 12px;background:none;
  color:var(--dim);white-space:nowrap;font-size:13.5px;font-weight:600}
nav.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);
  box-shadow:0 1px 2px rgba(19,36,46,.12)}

/* 入力 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;color:var(--sub);font-weight:600}
.f input,.f select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);font-size:15px;color:var(--ink)}
.f input[readonly]{background:var(--head);color:var(--dim)}
.wide{grid-column:1/-1}

/* 表 */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--panel);
  border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap;width:100%}
th,td{border-bottom:1px solid var(--hair);padding:0;text-align:right}
thead th{position:sticky;top:0;z-index:3;background:var(--head);font-size:11px;color:var(--dim);
  font-weight:700;padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
th.stick,td.stick{position:sticky;left:0;z-index:2;background:var(--panel);
  border-right:1px solid var(--line)}
thead th.stick{z-index:4;background:var(--head);text-align:left}
td input,td select{width:100%;border:0;background:none;padding:10px;text-align:right;
  font-size:14px;color:var(--ink)}
td input:focus{background:#eaf5fa;outline:none}
td select{text-align:left;padding:10px 4px;color:var(--dim);font-size:12.5px}
td.calc{color:var(--dim);background:#f2f8fb;padding:10px}
td.txt{text-align:left;padding:10px}
td.team select{min-width:118px}
td.lgc select{min-width:96px}
td.salc{min-width:118px}
td.salc input{min-width:74px}
td .w4{min-width:52px}
td.uzrc{padding:0}
.uzrbox{display:flex;align-items:center}
.sgn.unit{color:var(--dim);font-size:12px;font-weight:600}
.sgn{flex:0 0 30px;border:0;background:none;padding:10px 0;font-size:15px;font-weight:700;
  color:var(--accent);border-radius:0}
.sgn.mi{color:#1b6ea8}
.uzrbox input{flex:1;min-width:44px}
td.calc.hit{color:var(--accent);font-weight:700}
tr.tot td{font-weight:700;background:var(--head);padding:10px;border-top:2px solid var(--ink)}
tr.avg td{color:var(--dim);background:#eef6fa;padding:8px 10px;font-size:12px}
tr.open td.stick{background:var(--accent)}
tr.open button.yr{color:#fff}
tr.open button.yr .lg{color:#fff;opacity:.85}
button.yr{width:100%;border:0;border-radius:0;padding:10px;text-align:left;font-weight:700;
  font-size:14.5px;background:none;color:var(--ink);display:flex;gap:6px;align-items:baseline}
button.yr .lg{font-size:10px;color:var(--accent);font-weight:600}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block}
tr.open .dot{background:#fff}
button.link{border:0;padding:0;background:none;color:var(--ink);font-size:13.5px;font-weight:600;
  text-decoration:underline;text-underline-offset:3px}

/* パネル */
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-top:16px;padding:16px}
.panel>h3{margin:0 0 10px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.blk{margin-top:20px}
.blk>h4{margin:0 0 10px;font-size:12px;color:var(--sub);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip input{position:absolute;opacity:0;width:0;height:0}
.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:16px;
  font-size:12.5px;color:var(--dim);background:var(--panel)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.badge{display:inline-block;font-size:11.5px;padding:4px 10px;border:1px solid var(--line);
  border-radius:4px;color:var(--dim);background:var(--panel)}
.badge.on{background:var(--accent);border-color:var(--accent);color:#fff}
.badge.off{color:var(--sub)}
.inj{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:3px;
  background:#f6e3e1;color:var(--hot);font-size:10px;font-weight:700}
.auto{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:6px;
  background:#f6e9e7;color:var(--hot);font-size:13px;font-weight:600;margin-bottom:8px}
.mini{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.mini .f{flex:1}
.mini button{padding:8px 10px;font-size:12px}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:13.5px}
dl.kv dt{color:var(--sub)}
dl.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.den{font-size:11px;color:var(--sub);font-weight:400}
.note{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.8}

/* 年ナビ */
.ynav{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:10px 14px;margin-bottom:14px}
.ynav .y{font-size:30px;font-weight:700;line-height:1}
.ynav select{border:0;background:none;font-size:12px;color:var(--sub)}
.ynav button{padding:8px 14px;font-weight:700}
.ynav button:disabled{opacity:.3}

/* 打線 */
.lu{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;overflow:hidden}
.lus{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--hair);padding:2px 10px}
.lus:last-child{border-bottom:0}
.lus .n{flex:0 0 18px;text-align:center;font-size:12px;font-weight:700;color:var(--sub)}
.lus select{flex:1;min-width:0;padding:10px 0;border:0;background:none;font-size:14.5px;color:var(--ink)}
.lus select.p{flex:0 0 84px;font-size:12px;color:var(--dim)}
.lus .st{flex:0 0 118px;text-align:right;font-size:11px;color:var(--dim)}

/* 下部 */
footer.fx{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
  border-top:1px solid var(--line);padding:10px 14px calc(8px + env(safe-area-inset-bottom));z-index:9}
footer.fx .in{max-width:920px;margin:0 auto;display:flex;gap:10px}
footer.fx .in:empty{display:none}
footer.fx button{flex:1}
.tabbar{max-width:920px;margin:0 auto;display:flex;gap:4px;padding-top:8px}
.tabbar button{flex:1;border:0;background:none;border-radius:6px;padding:8px 0;
  font-size:12px;font-weight:700;color:var(--sub)}
.tabbar button[aria-selected=true]{color:var(--accent);background:var(--head)}
.toast{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:6px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
.warn{background:#fbeeec;border:1px solid #e0bab4;color:#8a2f26;padding:10px 12px;border-radius:6px;
  font-size:12px;line-height:1.7;margin-bottom:14px}
.ovl{position:fixed;inset:0;background:rgba(19,36,46,.5);display:grid;place-items:center;z-index:30;padding:20px}
.ovl .box{background:var(--panel);border-radius:10px;padding:20px;width:100%;max-width:360px}
.ovl h3{margin:0;font-size:16px;font-weight:700}
.ovl input,.ovl textarea{width:100%;margin-top:12px;padding:10px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);font-size:16px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

async function sget(k){
  if(mode==="app"){try{const r=await window.storage.get(k);return r&&r.value;}catch(e){return null;}}
  if(mode==="local"){try{return localStorage.getItem(k);}catch(e){return null;}}

function blankDB(){return{players:[],teams:[{name:HOME,league:"セ・リーグ"}],recs:{},lineups:{}};}
function normalize(raw){
  let db;
  if(Array.isArray(raw))db={players:raw};
  else if(raw&&raw.db)db=raw.db;
  else if(raw&&raw.players)db={players:raw.players};
  else db=blankDB();
  db.players=db.players||[];db.teams=db.teams||[];db.recs=db.recs||{};db.lineups=db.lineups||{};db.league=db.league||{};
  if(!db.teams.some(t=>t.name===HOME))db.teams.unshift({name:HOME,league:"セ・リーグ"});
  db.players.forEach(p=>{
    p.seasons=p.seasons||[];
    if(p.name&&!p.last&&!p.first){p.last=p.name;}
    if(!p.origin)p.origin=p.foreign?"foreign":"draft";
    p.foreign=(p.origin==="foreign");
    if(!p.type)p.type=(p.pos==="投手")?"投手":"野手";
    if(!Array.isArray(p.positions))p.positions=(p.pos&&p.pos!=="投手")?[p.pos]:[];
    (p.seasons||[]).forEach(s=>{
      s.bat=s.bat||{};s.pit=s.pit||{};s.titles=s.titles||[];s.events=s.events||[];s.injuries=s.injuries||[];
      if(s.team&&!db.teams.some(t=>t.name===s.team))db.teams.push({name:s.team,league:s.league||"セ・リーグ"});
      if(s.team&&(has(s.rank)||s.jpChamp||s.divWin||s.wsIn||s.wsWin)){
        const k=rk(s.team,s.year),r=db.recs[k]||{};
        if(has(s.rank)&&!has(r.rank))r.rank=s.rank;
        ["jpChamp","divWin","wsIn","wsWin"].forEach(f=>{if(s[f])r[f]=true;});
        db.recs[k]=r;
      }
      delete s.rank;delete s.jpChamp;delete s.divWin;delete s.wsIn;delete s.wsWin;
    });
  });
  return db;
}

const uzrVal=b=>(b&&b.uzrSign==="-"?-1:1)*n(b&&b.uzr);
function bc(b,pos,base){b=b||{};
  if(!isFinite(base))base=0.740;
  const pa=n(b.pa),g=n(b.g);
  const avg=has(b.avg)?n(b.avg):NaN, obp=has(b.obp)?n(b.obp):NaN;
  let bb=NaN,ab=NaN,h=NaN;
  const sac=n(b.sac);
  if(pa>0&&isFinite(avg)&&isFinite(obp)&&avg!==1){
    bb=pa*(obp-avg)/(1-avg);
    if(!isFinite(bb)||bb<0)bb=0;
    if(bb>pa-sac)bb=Math.max(0,pa-sac);
    ab=pa-bb-sac; if(ab<0)ab=0;
    h=avg*ab;
  }
  const tb=isFinite(h)?h+n(b.d2)+2*n(b.d3)+3*n(b.hr):NaN;
  const slg=(isFinite(tb)&&ab>0)?tb/ab:NaN;
  const ops=(isFinite(obp)&&isFinite(slg))?obp+slg:NaN;
  const wrcAuto=isFinite(ops)?Math.round(100+(ops-base)*250):NaN;
  const wrc=has(b.wrc)?n(b.wrc):wrcAuto;
  const uzr=uzrVal(b);
  const adj=(POSADJ[pos]!=null?POSADJ[pos]:0)*(pa/600);
  const x=(wrc-100)/10;
  const batWin=(x<=6?(0.792*x-0.0208*x*x):(4.003+0.774*(x-6)))*(pa/600);
  const war=(isFinite(wrc)&&pa>0)?(batWin+(uzr+n(b.sb)*0.15+pa*0.025)/10+adj):NaN;
  return{bb,ab,h,tb,slg,ops,wrcAuto,wrc,uzr,war,avg};}
let LGC=new Map();
/* 1995〜2025は実際のセ・リーグの数値 */
const LGD={1995:[3.92,0.758],1996:[4.07,0.768],1997:[3.86,0.754],1998:[3.67,0.737],1999:[4.13,0.773],2000:[3.91,0.754],2001:[3.78,0.756],2002:[3.59,0.731],2003:[4.17,0.777],2004:[4.40,0.798],2005:[4.11,0.767],2006:[3.68,0.737],2007:[3.84,0.753],2008:[3.74,0.738],2009:[3.55,0.725],2010:[4.13,0.765],2011:[3.06,0.665],2012:[2.87,0.670],2013:[3.72,0.721],2014:[3.89,0.742],2015:[3.25,0.697],2016:[3.69,0.721],2017:[3.68,0.719],2018:[4.10,0.754],2019:[3.90,0.738],2020:[3.83,0.738],2021:[3.61,0.720],2022:[3.36,0.678],2023:[3.19,0.668],2024:[2.88,0.645],2025:[2.97,0.652]};
const LG_LO=1995,LG_HI=2025;
function lgEra(y){
  y=n(y)||2000;
  if(LGC.has(y))return LGC.get(y);
  const L=S.db.league=S.db.league||{};
  if(has(L[y])){const v0=n(L[y]);LGC.set(y,v0);return v0;}
  if(LGD[y]){LGC.set(y,LGD[y][0]);return LGD[y][0];}
  let v,from,dir;
  if(y>LG_HI){v=lgEra(LG_HI);from=LG_HI+1;dir=1;}
  else{v=lgEra(LG_LO);from=LG_LO-1;dir=-1;}
  for(let t=from;(dir>0)?(t<=y):(t>=y);t+=dir){
    if(has(L[t]))v=n(L[t]);
    else{
      const h=Math.abs(Math.round(Math.sin(t*12.9898)*43758.5453));
      let d=((h%41)-20)/100*0.8-(v-3.80)*0.30;
      if(d>0.25)d=0.25;
      if(d<0-0.25)d=0-0.25;
      const prev=v;
      v=Math.round((v+d)*100)/100;
      if(v>4.10)v=4.10;
      if(v<3.50)v=3.50;
      if(v>prev+0.25)v=Math.round((prev+0.25)*100)/100;
      if(v<prev-0.25)v=Math.round((prev-0.25)*100)/100;
    }
    LGC.set(t,v);
  }
  return v;
}
function lgOPS(y){
  y=n(y)||2000;
  const L=S.db.league||{};
  if(!has(L[y])&&LGD[y])return LGD[y][1];
  let v=0.740+(lgEra(y)-3.80)*0.09;
  if(v>0.770)v=0.770;
  if(v<0.710)v=0.710;
  return Math.round(v*1000)/1000;
}
function pcalc(q,LG){q=q||{};
  if(!isFinite(LG))LG=LG_ERA;
  const g=n(q.g),gs=n(q.gs),ipg=n(q.ipg),era=has(q.era)?n(q.era):NaN,k9=has(q.k9)?n(q.k9):NaN,bb=n(q.ba);
  const ip=g>0?((gs>0?ipg*gs:0)+(g-gs)*1.0):NaN;
  const outs=isFinite(ip)?Math.round(ip*3):0;
  const er=(isFinite(ip)&&isFinite(era))?era*ip/9:NaN;
  const so=(isFinite(ip)&&isFinite(k9))?k9*ip/9:NaN;
  const bb9=isFinite(ip)&&ip>0?bb*9/ip:NaN;
  let h9=NaN;
  if(isFinite(era)){
    h9=8.6+(era-LG)*1.1-((isFinite(k9)?k9:7.0)-7.0)*0.35-((isFinite(bb9)?bb9:3.0)-3.0)*0.5;
    if(h9<3)h9=3;
  }
  const ha=(isFinite(ip)&&isFinite(h9))?h9*ip/9:NaN;
  const whip=(isFinite(ip)&&ip>0&&isFinite(ha))?(ha+bb)/ip:NaN;
  const w=n(q.w),l=n(q.l);
  const wpct=(w+l)>0?w/(w+l):NaN;
  let qsr=NaN,qs=NaN;
  if(gs>0&&ipg>0&&isFinite(era)){
    qsr=0.55+(ipg-5.8)*0.28+(LG-era)*0.13;
    if(qsr<0)qsr=0; if(qsr>0.95)qsr=0.95;
    qs=Math.round(qsr*gs);
  }
  const rel=g>0?(0.85+0.15*Math.min(1,gs/g)):1;
  const war=isFinite(ip)&&isFinite(era)?(((LG-era)*ip/9/10*1.17+ip*0.0103)*rel):NaN;
  return{outs,ip,er,so,ha,whip,wpct,qsr,qs,war,era,h9};}
const REG_PA=g=>Math.round(g*3.1),REG_IP=g=>g;
function regDays(p,s){
  if(has(s.days))return Math.min(n(s.days),isMLB(s)?172:145);
  const G=n(s.games)||(isMLB(s)?162:143),full=isMLB(s)?172:145;
  let r=0;
  if(isP(p)){const app=n(s.pit.g),base=s.role==="先発"?G/5:G/2.2;r=base>0?app/base:0;}
  else r=G>0?n(s.bat.g)/G:0;
  return Math.round(Math.max(0,Math.min(1,r))*full);
}
function rights(p){
  const need=p.route==="高卒"?8:(n(draftYear(p))>=2007?7:8);
  const ss=[...p.seasons].sort((a,b)=>n(a.year)-n(b.year));
  let npb=0,mlb=0,dom=false,ovs=false,arb=false,fa=false;const marks={};
  const push=(y,t)=>{(marks[y]=marks[y]||[]).push(t);};
  ss.forEach(s=>{const d=regDays(p,s);
    if(isMLB(s)){mlb+=d;
      if(!arb&&mlb>=172*3){arb=true;push(s.year,"MLB年俸調停の資格取得");}
      if(!fa&&mlb>=172*6){fa=true;push(s.year,"MLB FA資格取得");}}
    else{npb+=d;
      if(!dom&&npb>=145*need){dom=true;push(s.year,"国内FA権取得");}
      if(!ovs&&npb>=145*9){ovs=true;push(s.year,"海外FA権取得");}}});
  return{marks,need};
}
function totals(p){
  const ss=p.seasons,yrs=ss.length,B={},P={};
  ["g","pa","ab","h","d2","d3","hr","rbi","sb","bb","sac","ph","uzr","wrc","salary"].forEach(k=>B[k]=0);
  ["w","l","sv","hld","g","gs","cg","sho","ba","er","so","ha","qs","war","salary"].forEach(k=>P[k]=0);
  let tb=0,outs=0,uzr=0,wrc=0,warB=0,uzrY=0,wrcY=0,warY=0;
  ss.forEach(s=>{const b=s.bat||{},q=s.pit||{};
    const c=bc(b,s.pos,lgOPS(s.year));
    ["g","pa","d2","d3","hr","rbi","sb","sac","ph"].forEach(k=>B[k]+=n(b[k]));
    if(isFinite(c.h)){B.h+=c.h;B.ab+=c.ab;B.bb+=c.bb;tb+=c.tb;}
    if(isFinite(c.war)){warB+=c.war;warY++;}
    if(n(b.pa)>0||has(b.uzr)){uzr+=c.uzr;uzrY++;}
    if(isFinite(c.wrc)){wrc+=c.wrc;wrcY++;}
    ["w","l","sv","hld","g","gs","cg","sho","ba"].forEach(k=>P[k]+=n(q[k]));
    P.salary+=salMan(s);B.salary+=salMan(s);
    const pq=pcalc(q,lgEra(s.year));
    if(isFinite(pq.ip)){outs+=pq.outs;P.er+=pq.er;P.so+=pq.so;P.ha+=pq.ha;P.war+=pq.war;}
    if(isFinite(pq.qs))P.qs+=pq.qs;});
  const ab=B.ab,pa=B.pa;
  const obp=pa>0?(B.h+B.bb)/pa:NaN,slg=ab>0?tb/ab:NaN;
  return{yrs,B,P,tb,outs,uzr,wrc,warB,uzrY,wrcY,warY,
    avg:ab>0?B.h/ab:NaN,slg,obp,
    ops:(isFinite(obp)&&isFinite(slg))?obp+slg:NaN,
    era:outs>0?P.er*27/outs:NaN,whip:outs>0?(P.ha+P.ba)*3/outs:NaN,
    qsr:P.gs>0?P.qs/P.gs:NaN,ipg:P.g>0?(outs/3)/P.g:NaN,
    wpct:(P.w+P.l)>0?P.w/(P.w+P.l):NaN};
}

function getLineup(y,ros){
  const key=rk(HOME,y);
  const L=S.db.lineups[key]=S.db.lineups[key]||{order:[],bench:[],rot:[],mid:[],closer:""};
  while(L.order.length<9)L.order.push({pid:"",pos:""});
  L.bench=L.bench||[];
  while(L.bench.length<2)L.bench.push({pid:""});
  while(L.rot.length<5)L.rot.push("");
  L.mid=L.mid||[];
  while(L.mid.length<4)L.mid.push("");
  const inRoster=id=>!id||ros.some(x=>x.p.id===id);
  L.order.forEach(o=>{if(!inRoster(o.pid)){o.pid="";o.pos="";}});
  L.bench.forEach(o=>{if(!inRoster(o.pid))o.pid="";});
  L.rot=L.rot.map(id=>inRoster(id)?id:"");
  L.mid=L.mid.map(id=>inRoster(id)?id:"");
  if(!inRoster(L.closer))L.closer="";
  return L;
}
function lineupWAR(ros,L){
  let total=0;
  [...L.order,...L.bench].forEach(o=>{
    const f=ros.find(x=>x.p.id===o.pid);if(!f)return;
    const c=bc(f.s.bat,f.s.pos,lgOPS(f.s.year));
    if(isFinite(c.war))total+=c.war;});
  [...L.rot,...L.mid,L.closer].forEach(pid=>{
    const f=ros.find(x=>x.p.id===pid);if(!f)return;
    const c=pcalc(f.s.pit,lgEra(f.s.year));
    if(isFinite(c.war))total+=c.war;});
  return total;
}
function warProjection(teamWAR){
  const w=Math.round(Math.max(45,Math.min(100,60+teamWAR)));
  return{w,l:143-w};
}
function batLine(f){
  const c=bc(f.s.bat,f.s.pos,lgOPS(f.s.year));
  const age=ageAt(f.p,n(f.s.year));
  return(f.p.bats?"("+f.p.bats.slice(0,2)+")":"")+(age!==""?age+"歳 ":"")+
    r3(c.avg)+" "+n(f.s.bat.hr)+"本 "+n(f.s.bat.rbi)+"点 OPS"+(isFinite(c.ops)?c.ops.toFixed(3):"—")+
    " WAR"+r1(c.war);
}
function pitLine(f){
  const c=pcalc(f.s.pit,lgEra(f.s.year));
  const age=ageAt(f.p,n(f.s.year));
  return(f.p.throws?"("+f.p.throws.slice(0,2)+")":"")+(age!==""?age+"歳 ":"")+
    n(f.s.pit.w)+"勝"+n(f.s.pit.l)+"敗 "+r2(c.era);
}

      if(!isP(p)){
        const c=bc(s.bat,s.pos,lgOPS(s.year));
        if(n(s.bat.pa)>=REG_PA(n(s.games))&&isFinite(c.ops)&&(!bb||c.ops>bb.ops))bb={p,s,ops:c.ops};
      }else{
        const c=pcalc(s.pit,lgEra(s.year));
        if(isFinite(c.war)&&(!pp||c.war>pp.war))pp={p,s,war:c.war};
      }});
    const tr=el("tr");
    const st=el("td","stick txt");
    const lk=el("button","link",String(y));
    lk.onclick=()=>{S.tyear=y;S.ttab="year";render();scrollTo(0,0);};
    st.append(lk);tr.append(st);
    const add=v=>tr.append(el("td","calc",String(v)));
    add((has(R.rank)?R.rank+"位":"—")+(R.jpChamp?" 日本一":R.pennant?" 優勝":""));
    add(has(R.w)?R.w:"—");add(has(R.l)?R.l:"—");add(has(R.d)?R.d:"—");
    add(ros.length);add(tc||"—");
    add(bb?NM(bb.p)+" "+bb.ops.toFixed(3):"—");
    add(pp?NM(pp.p)+" "+r1(pp.war):"—");
    bd.append(tr);});
  tb.append(bd);wrap.append(tb);m.append(wrap);

  m.append(rankBlock());
}

const RSTAT={
  bat:[["h","安打","sum"],["hr","本塁打","sum"],["rbi","打点","sum"],["sb","盗塁","sum"],
       ["d2","二塁打","sum"],["d3","三塁打","sum"],["bb","四球","sum"],["g","試合","sum"],
       ["pa","打席","sum"],["war","WAR","sum"],["uzr","UZR","sum"],
       ["avg","打率","rate"],["obp","出塁率","rate"],["slg","長打率","rate"],
       ["ops","OPS","rate"],["wrc","wRC+","rate"]],
  pit:[["w","勝利","sum"],["sv","セーブ","sum"],["hld","ホールド","sum"],["so","奪三振","sum"],
       ["ip","投球回","sum"],["qs","QS","sum"],["cg","完投","sum"],["sho","完封","sum"],
       ["g","登板","sum"],["war","WAR","sum"],
       ["era","防御率","rate"],["whip","WHIP","rate"],["k9","奪三振率","rate"]]
};
const LOWBEST={era:1,whip:1};
function statOf(p,s,key,kind){
  if(kind==="bat"){
    const c=bc(s.bat,s.pos,lgOPS(s.year)),b=s.bat||{};
    if(key==="h")return c.h;if(key==="war")return c.war;
    if(key==="avg")return c.avg;if(key==="slg")return c.slg;
    if(key==="ops")return c.ops;if(key==="obp")return has(b.obp)?n(b.obp):NaN;
    if(key==="wrc")return c.wrc;if(key==="uzr")return c.uzr;
    if(key==="bb")return c.bb;
    return n(b[key]);
  }
  const c=pcalc(s.pit,lgEra(s.year)),q=s.pit||{};
  if(key==="ip")return c.outs/3;if(key==="so")return c.so;if(key==="qs")return c.qs;
  if(key==="war")return c.war;if(key==="era")return c.era;if(key==="whip")return c.whip;
  if(key==="k9")return has(q.k9)?n(q.k9):NaN;
  return n(q[key]);
}
function regOK(p,s,kind){
  return kind==="bat"?(n(s.bat.pa)>=REG_PA(n(s.games)))
                     :(pcalc(s.pit,lgEra(s.year)).outs/3>=REG_IP(n(s.games)));
}
function rankBlock(){
  const kind=S.rkind=S.rkind||"bat";
  const scope=S.rscope=S.rscope||"home";
  const list=RSTAT[kind];
  if(!list.some(x=>x[0]===S.rkey))S.rkey=list[0][0];
  const key=S.rkey,type=(list.find(x=>x[0]===key)||[])[2];
  const w=el("div","blk");w.append(el("h4",null,"ランキング"));
  const bar=el("div","row");
  const k1=el("select");[["bat","打者"],["pit","投手"]].forEach(([v,l])=>k1.append(new Option(l,v)));
  k1.value=kind;k1.onchange=()=>{S.rkind=k1.value;S.rkey=null;render();};
  const k2=el("select");list.forEach(([v,l])=>k2.append(new Option(l,v)));
  k2.value=key;k2.onchange=()=>{S.rkey=k2.value;render();};
  const k3=el("select");[["home","M9在籍時"],["all","キャリア全体"]].forEach(([v,l])=>k3.append(new Option(l,v)));
  k3.value=scope;k3.onchange=()=>{S.rscope=k3.value;render();};
  [k1,k2,k3].forEach(x=>{x.style.cssText="padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:14px";});
  bar.append(k1,k2,k3);w.append(bar);

  const tot=new Map(),best=[];
  S.db.players.forEach(p=>{
    if((kind==="bat")===isP(p))return;
    if(scope==="home"&&!p.seasons.some(s=>s.team===HOME))return;
    let num=0,den=0,sum=0,ok=false;
    p.seasons.forEach(s=>{
      if(scope==="home"&&s.team!==HOME)return;
      const v=statOf(p,s,key,kind);
      if(!isFinite(v))return;
      ok=true;
      if(type==="sum")sum+=v;
      else{const wgt=kind==="bat"?n(s.bat.pa):(pcalc(s.pit,lgEra(s.year)).outs/3);
        num+=v*wgt;den+=wgt;}
      if(type!=="rate"||regOK(p,s,kind))best.push({p,s,v});
    });
    if(!ok)return;
    if(type==="sum")tot.set(p.id,{p,v:sum});
    else if(den>=(kind==="bat"?1000:300))tot.set(p.id,{p,v:num/den});
  });
  const low=LOWBEST[key];
  const cmp=(a,b)=>low?a.v-b.v:b.v-a.v;
  const fmtv=v=>{
    if(key==="avg"||key==="obp"||key==="slg")return r3(v);
    if(key==="ops")return isFinite(v)?v.toFixed(3):"—";
    if(key==="era"||key==="whip")return r2(v);
    if(key==="war"||key==="uzr"||key==="k9")return r1(v);
    if(key==="ip")return r1(v);
    return String(Math.round(v));};
  const col=(title,rows,withYear)=>{
    const b=el("div","blk");b.append(el("h4",null,title));
    if(!rows.length){b.append(el("p","note","該当なし"));return b;}
    const kv=el("dl","kv");
    rows.slice(0,10).forEach((r,i)=>{
      kv.append(el("dt",null,(i+1)+". "+NM(r.p)+(withYear?"　"+r.s.year:"")));
      kv.append(el("dd",null,fmtv(r.v)));});
    b.append(kv);return b;};
  w.append(col("通算",[...tot.values()].sort(cmp),false));
  w.append(col("シーズン最高",best.sort(cmp),true));
  if(type==="rate")w.append(el("p","note",
    "率の通算は"+(kind==="bat"?"1000打席":"300回")+"以上、シーズン最高は規定到達年のみを対象にしています。"));
  return w;
}

      calc.reg.textContent=need;calc.reg.className="calc"+(ok?" hit":"");
    }else{const c=bc(s.bat,s.pos,lgOPS(s.year));
      calc.h.textContent=RND(c.h);calc.bb.textContent=RND(c.bb);calc.ab.textContent=RND(c.ab);
      calc.slg.textContent=r3(c.slg);
      calc.ops.textContent=isFinite(c.ops)?c.ops.toFixed(3):"—";
      calc.war.textContent=r1(c.war);
      if(ins.wrc&&ins.wrc._i)ins.wrc._i.placeholder=isFinite(c.wrcAuto)?String(c.wrcAuto):"";
      const need=REG_PA(n(s.games)),ok=n(s.bat.pa)>=need;
      calc.reg.textContent=need;calc.reg.className="calc"+(ok?" hit":"");}
  }
  upd();return tr;
}

function tabSeason(m,p){
  if(!p.seasons.length){
    m.replaceChildren(el("p","empty","シーズンがありません。下の「シーズンを追加」から作ってください。"));return;}
  p.seasons.sort((a,b)=>n(a.year)-n(b.year));
  const R=rights(p),pit=isP(p),SEQ=pit?PSEQ:BSEQ;
  const wrap=el("div","scroll"),tb=el("table"),hd=el("thead"),hr=el("tr");
  hr.append(el("th","stick","年"));
  SEQ.forEach(([k,lb])=>hr.append(el("th",null,lb)));
  hd.append(hr);tb.append(hd);
  const bd=el("tbody");tb.append(bd);
  p.seasons.forEach(s=>bd.append(seasonRow(p,s,R,SEQ,pit)));

  const t=totals(p),y=t.yrs;
  const sum=k=>{
    if(pit){
      if(k==="ip")return outsIp(t.outs);
      if(k==="so")return RND(t.P.so);if(k==="ha")return RND(t.P.ha);if(k==="er")return RND(t.P.er);
      if(k==="whip")return r2(t.whip);if(k==="wpct")return r3(t.wpct);
      if(k==="qs")return String(t.P.qs);if(k==="qsr")return pct(t.qsr);
      if(k==="war")return r1(t.P.war);
      if(k==="salary")return yen(t.P.salary);
      if(k==="era")return r2(t.era);if(k==="ipg")return r2(t.P.gs>0?(t.outs/3)/t.P.gs:NaN);
      if(k==="k9")return r1(t.outs>0?t.P.so*27/t.outs:NaN);
      return t.P[k]!=null?String(t.P[k]):"";
    }
    if(k==="h")return RND(t.B.h);if(k==="bb")return RND(t.B.bb);if(k==="ab")return RND(t.B.ab);
    if(k==="slg")return r3(t.slg);if(k==="ops")return isFinite(t.ops)?t.ops.toFixed(3):"—";
    if(k==="war")return r1(t.warB);
    if(k==="avg")return r3(t.avg);if(k==="obp")return r3(t.obp);
    if(k==="salary")return yen(t.B.salary);
    if(k==="uzr")return r1(t.uzrY?t.uzr/t.uzrY:NaN);if(k==="wrc")return r1(t.wrcY?t.wrc/t.wrcY:NaN);
    return t.B[k]!=null?String(t.B[k]):"";
  };
  const avgv=k=>{
    if(pit){
      if(k==="ip")return r1(t.outs/3/y);
      if(k==="so")return r1(t.P.so/y);if(k==="ha")return r1(t.P.ha/y);if(k==="er")return r1(t.P.er/y);
      if(k==="qs")return r1(t.P.qs/y);if(k==="war")return r1(t.P.war/y);
      if(k==="whip"||k==="wpct"||k==="qsr"||k==="era"||k==="ipg"||k==="k9")return "—";
      if(k==="salary")return yen(t.P.salary/y);
      return t.P[k]!=null?r1(t.P[k]/y):"";
    }
    if(k==="h")return r1(t.B.h/y);if(k==="bb")return r1(t.B.bb/y);if(k==="ab")return r1(t.B.ab/y);
    if(k==="war")return r1(t.warY?t.warB/t.warY:NaN);
    if(k==="uzr")return r1(t.uzrY?t.uzr/t.uzrY:NaN);
    if(k==="wrc")return r1(t.wrcY?t.wrc/t.wrcY:NaN);
    if(k==="avg"||k==="obp"||k==="slg"||k==="ops")return "—";
    if(k==="salary")return yen(t.B.salary/y);
    return t.B[k]!=null?r1(t.B[k]/y):"";
  };
  const mk=(cls,label,fn)=>{
    const tr=el("tr",cls),st=el("td","stick "+cls);st.textContent=label;tr.append(st);
    SEQ.forEach(([k,lb,ty])=>{
      tr.append(el("td",cls,(ty==="in"||ty==="calc")?fn(k):""));});
    return tr;};
  bd.append(mk("tot","通算",sum));
  bd.append(mk("avg","年平均",avgv));
  wrap.append(tb);m.append(wrap);
  m.append(el("p","note","左の年をタップすると、タイトル・出来事・怪我を書けます。右にスクロールすると細かい項目とチーム欄が出ます。"));
  if(S.open){const s=p.seasons.find(x=>x.id===S.open);if(s)m.append(detail(p,s,R));}
}
function detail(p,s,R){
  const w=el("div","panel");
  w.style.setProperty("--accent",isMLB(s)?"var(--mlb)":(s.league==="セ・リーグ"?"var(--ce)":"var(--pa)"));
  const h=el("h3",null,s.year+"年");
  const cl=el("button",null,"閉じる");cl.style.marginLeft="auto";
  cl.onclick=()=>{S.open=null;render();};
  h.append(el("span","badge",s.team||"—"),cl);w.append(h);
  const yg=el("div","grid");
  yg.append(field("年",s,"year",{mode:"numeric",on:()=>{}}));
  w.append(yg);
  (R.marks[s.year]||[]).forEach(t=>{
    const a=el("div","auto");a.append(el("span","badge on","自動"),el("span",null,t));w.append(a);});
  const tb=el("div","blk");tb.append(el("h4",null,"個人タイトル"));
  const chips=el("div","chips");
  (isMLB(s)?MLB_T:NPB_T).forEach(t=>{
    const lab=el("label","chip"),cb=el("input");cb.type="checkbox";
    cb.checked=(s.titles||[]).includes(t);
    cb.onchange=()=>{s.titles=s.titles||[];
      if(cb.checked){if(!s.titles.includes(t))s.titles.push(t);}else s.titles=s.titles.filter(x=>x!==t);
      save(1);};
    lab.append(cb,el("span",null,t));chips.append(lab);});
  tb.append(chips);w.append(tb);

  const ev=el("div","blk");ev.append(el("h4",null,"出来事"));
  const list=el("div");ev.append(list);
  function drawEv(){list.innerHTML="";
    (s.events||[]).forEach((e,i)=>{const r=el("div","mini");
      r.append(field("",e,"note",{mode:"text",ph:"例：FA権を行使して移籍／三塁から一塁へコンバート"}));
      const d=el("button","danger","削除");d.onclick=()=>{s.events.splice(i,1);save(1);drawEv();};
      r.append(d);list.append(r);});}
  drawEv();
  const ea=el("button",null,"出来事を追加");
  ea.onclick=()=>{s.events=s.events||[];s.events.push({note:""});save(1);drawEv();};
  ev.append(ea);w.append(ev);

  const inj=el("div","blk");inj.append(el("h4",null,"怪我"));
  const il=el("div");inj.append(il);
  function drawInj(){il.innerHTML="";
    (s.injuries||[]).forEach((x,i)=>{
      const box=el("div");box.style.cssText="border:1px solid var(--line);border-radius:3px;padding:8px;margin-bottom:7px";
      const g=el("div","grid");
      g.append(field("内容",x,"name",{mode:"text",wide:true,ph:"右肘を痛めた など"}));
      const days=el("span","badge off");
      const calc=()=>{if(!x.from||!x.to){days.textContent="期間未入力";return;}
        const a=new Date(x.from),c=new Date(x.to);
        days.textContent=(isNaN(a)||isNaN(c))?"期間未入力":"離脱 "+Math.max(0,Math.round((c-a)/86400000))+"日";};
      g.append(field("離脱開始",x,"from",{type:"date",on:calc}));
      g.append(field("復帰",x,"to",{type:"date",on:calc}));
      calc();box.append(g);
      const r=el("div","row");r.style.marginTop="6px";
      const d=el("button","danger","削除");d.onclick=()=>{s.injuries.splice(i,1);save(1);drawInj();};
      r.append(days,el("span","spacer"),d);box.append(r);il.append(box);});}
  drawInj();
  const ia=el("button",null,"怪我を追加");
  ia.onclick=()=>{s.injuries=s.injuries||[];s.injuries.push({name:"",from:"",to:""});save(1);drawInj();};
  inj.append(ia);w.append(inj);

  const lg=el("div","blk");lg.append(el("h4",null,"この年のリーグ環境"));
  const sg=el("div","grid");
  sg.append(field("年俸",s,"salary",{mode:"numeric",ph:"3000"}));
  sg.append(field("単位",s,"salaryUnit",{options:["万","億"]}));
  lg.append(sg);
  const lf=el("div","f");lf.append(el("label",null,"リーグ平均防御率"));
  const li=el("input");li.inputMode="decimal";li.value=String(lgEra(s.year));
  li.style.cssText="width:100%;padding:7px 6px;border:1px solid var(--line);border-radius:3px;font-size:15px";
  li.oninput=()=>{S.db.league[n(s.year)||2000]=li.value;LGC=new Map();save(1);};
  lf.append(li);lg.append(lf);
  lg.append(el("p","note","1995〜2025年は実際のセ・リーグの数値。それ以外の年は防御率3.80／OPS.740を中心に、防御率±0.30・OPS±30の範囲で緩やかに動きます。防御率の評価・被安打・QS率・WARの基準になります。書き換えれば固定されます。"));
  w.append(lg);
  const dz=el("div","blk");dz.append(el("h4",null,isMLB(s)?"サービスタイム":"一軍登録日数"));
  const dg=el("div","grid");
  const auto=el("div","f");auto.append(el("label",null,"試合からの算出"));
  const ai=el("input");ai.readOnly=true;ai.value=regDays(p,Object.assign({},s,{days:""}))+"日";
  auto.append(ai);dg.append(auto);
  dg.append(field("手入力で上書き",s,"days",{mode:"numeric",ph:"空欄なら自動",on:()=>render()}));
  dz.append(dg);
  dz.append(el("p","note",isMLB(s)?"172日で1年。6年でFA、3年で年俸調停。":"145日で1シーズン。満たない年は合算して145日ごとに1シーズン。"));
  w.append(dz);
  const rm=el("button","danger","この年を削除");rm.style.marginTop="14px";
  rm.onclick=()=>dialog({title:s.year+"年を削除",body:"この年の成績が消えます。",danger:true,okText:"削除する",
    onOk:()=>{p.seasons=p.seasons.filter(x=>x.id!==s.id);S.open=null;save(1);render();}});
  w.append(rm);return w;
}
function tabTotal(m,p){
  const t=totals(p),y=t.yrs,pit=isP(p);
  if(!y){m.replaceChildren(el("p","empty","シーズンを入力すると通算成績が出ます。"));return;}
  const d=el("div","blk");d.append(el("h4",null,"通算の率（分子／分母）"));
  const kv=el("dl","kv");
  const add=(k,v,den)=>{kv.append(el("dt",null,k));const dd=el("dd");
    dd.append(el("span",null,v));if(den){dd.append(document.createElement("br"));dd.append(el("span","den",den));}
    kv.append(dd);};
  if(pit){
    const R1=v=>String(Math.round(v));
    add("防御率",r2(t.era),"自責 "+R1(t.P.er)+" × 9 ／ "+outsIp(t.outs)+"回");
    add("WHIP",r2(t.whip),"("+R1(t.P.ha)+"＋"+t.P.ba+") ／ "+outsIp(t.outs)+"回");
    add("勝率",r3(t.wpct),t.P.w+" ／ "+(t.P.w+t.P.l));
    add("QS率",pct(t.qsr),t.P.qs+" ／ 先発 "+t.P.gs);
    add("先発平均投球回",r2(t.P.gs>0?(t.outs/3)/t.P.gs:NaN),outsIp(t.outs)+"回 ／ 先発 "+t.P.gs);
    add("奪三振率",r1(t.outs>0?t.P.so*27/t.outs:NaN),"奪三振 "+R1(t.P.so));
    add("WAR",r1(t.P.war),"年平均 "+r1(t.P.war/y));
  }else{
    const R0=v=>String(Math.round(v));
    add("打率",r3(t.avg),R0(t.B.h)+" ／ "+R0(t.B.ab));
    add("出塁率",r3(t.obp),"("+R0(t.B.h)+"＋"+R0(t.B.bb)+") ／ "+t.B.pa);
    add("長打率",r3(t.slg),"塁打 "+R0(t.tb)+" ／ "+R0(t.B.ab));
    add("OPS",isFinite(t.ops)?t.ops.toFixed(3):"—","通算出塁率 ＋ 通算長打率");
    add("WAR",r1(t.warB),"年平均 "+r1(t.warY?t.warB/t.warY:NaN));
    add("UZR（年平均）",r1(t.uzrY?t.uzr/t.uzrY:NaN),"通算 "+r1(t.uzr));
    add("wRC+",r1(t.wrcY?t.wrc/t.wrcY:NaN),"年平均");
  }
  d.append(kv);m.append(d);

  const bt=el("div","blk");bt.append(el("h4",null,"所属の内訳"));
  const per=new Map();
  p.seasons.forEach(s=>{const a=per.get(s.team)||{y:0,from:1e9,to:0};
    a.y++;a.from=Math.min(a.from,n(s.year));a.to=Math.max(a.to,n(s.year));per.set(s.team,a);});
  const kv3=el("dl","kv");
  [...per.entries()].sort((a,b)=>a[1].from-b[1].from).forEach(([tm,a])=>{
    kv3.append(el("dt",null,tm||"—"),el("dd",null,a.from+"〜"+a.to+"（"+a.y+"年）"));});
  bt.append(kv3);m.append(bt);

  const reg=el("div","blk");reg.append(el("h4",null,"規定到達"));
  let hit=0;const rc=el("div","chips");
  p.seasons.forEach(s=>{const ok=pit?(ipOuts(s.pit.ip)/3>=REG_IP(n(s.games))):(n(s.bat.pa)>=REG_PA(n(s.games)));
    if(ok)hit++;rc.append(el("span","badge "+(ok?"on":"off"),s.year+(ok?" ○":" ×")));});
  reg.append(el("p","note",(pit?"規定投球回":"規定打席")+"到達 "+hit+"／"+y+"年"),rc);m.append(reg);

  const tt=el("div","blk");tt.append(el("h4",null,"獲得タイトル累計"));
  const map=new Map();
  p.seasons.forEach(s=>(s.titles||[]).forEach(x=>{
    const k=(isMLB(s)?"MLB":"NPB")+"／"+x;map.set(k,(map.get(k)||0)+1);}));
  if(!map.size)tt.append(el("p","note","まだタイトルの記録がありません。"));
  else{const kv2=el("dl","kv");
    [...map.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],"ja"))
      .forEach(([k,v])=>kv2.append(el("dt",null,k),el("dd",null,v+"回")));
    tt.append(kv2);}
  m.append(tt);

  const R=rights(p),hi=el("div","blk");hi.append(el("h4",null,"経歴"));
  const rows=[];
  p.seasons.forEach(s=>{
    (R.marks[s.year]||[]).forEach(x=>rows.push([s.year,s.team,x,true]));
    (s.events||[]).forEach(e=>{if((e.note||"").trim())rows.push([s.year,s.team,e.note,false]);});
    (s.injuries||[]).forEach(x=>{if((x.name||"").trim()){
      let dd="";if(x.from&&x.to){const a=new Date(x.from),c=new Date(x.to);
        if(!isNaN(a)&&!isNaN(c))dd="（"+Math.max(0,Math.round((c-a)/86400000))+"日離脱）";}
      rows.push([s.year,s.team,"怪我："+x.name+dd,false]);}});});
  if(!rows.length)hi.append(el("p","note","年度成績で年をタップして書いた内容が、ここに並びます。"));
  else{const tbl=el("table");tbl.style.whiteSpace="normal";const bd=el("tbody");
    rows.sort((a,b)=>a[0]-b[0]).forEach(r=>{
      const tr=el("tr");
      const c1=el("td",null,String(r[0]));c1.style.cssText="text-align:left;padding:6px 8px 6px 2px;font-weight:700";
      const c2=el("td",null,(r[1]?r[1]+"　":"")+r[2]);c2.style.cssText="text-align:left;padding:6px 2px;width:100%";
      if(r[3])c2.style.color="var(--accent)";
      tr.append(c1,c2);bd.append(tr);});
    tbl.append(bd);hi.append(tbl);}
  m.append(hi);
}

(async()=>{await load();render();})();
